server {
    listen 5800;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — all non-file routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    # Use Docker's internal DNS resolver so the hostname is re-resolved on each
    # connection rather than cached at nginx startup (prevents 502s after backend restarts)
    resolver 127.0.0.11 valid=5s;
    set $backend_upstream http://backend:7000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
