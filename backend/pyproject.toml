[project]
name = "flux-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.0",
    "gunicorn>=22.0",
    "whitenoise>=6.7",
    "python-decouple>=3.8",
    "pgvector>=0.5.1",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "fastembed>=0.9.0",
    "anthropic>=1.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
